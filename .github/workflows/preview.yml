# Plan morning-digest § 3 and § 4. Saves /digest/2026-10-28 as one HTML file and puts it on
# GitHub Pages without committing it anywhere (ADR 0003: no previews in the repo).
# marker=true: the banner carries the repo secret LANE_MARKER (review). marker=false: "no marker
# set" (clean-up), uploaded over the same link.
name: preview

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Show the lane marker in the banner
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}digest-2026-10-28.html
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save /digest/2026-10-28
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
          PORT: 8787
        run: |
          pnpm start > rig.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8787/health > /dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf http://localhost:8787/digest/2026-10-28 -o _site/digest-2026-10-28.html
          kill %1
          grep -c '<tr' _site/digest-2026-10-28.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
